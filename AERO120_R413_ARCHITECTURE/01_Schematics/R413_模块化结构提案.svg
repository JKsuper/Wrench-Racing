<svg baseProfile="full" height="1050" version="1.1" viewBox="0 0 1800 1050" width="1800" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#0e141c" height="1050" width="1800" x="0" y="0" /><text fill="#edf4fb" font-family="Noto Sans CJK SC, sans-serif" font-size="42" font-weight="700" x="60" y="76">AERO120-D   /   R4.13 MODULAR ARCHITECTURE</text><text fill="#97acbd" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" x="61" y="119">拆分外观 · 低成本调风 · 同一风道兼容立柱和横梁</text><text fill="#49cfdb" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" text-anchor="end" x="1736" y="78">STRUCTURE PROPOSAL</text><rect fill="#17212d" height="626" rx="16" ry="16" stroke="#354456" stroke-width="2" width="1048" x="45" y="158" /><rect fill="#17212d" height="626" rx="16" ry="16" stroke="#354456" stroke-width="2" width="647" x="1110" y="158" /><rect fill="#17212d" height="201" rx="16" ry="16" stroke="#354456" stroke-width="2" width="1712" x="45" y="805" /><text fill="#edf4fb" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" x="76" y="206">01  短风道与可拆卸风口</text><text fill="#edf4fb" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" x="1138" y="206">02  双安装方式</text><polygon fill="#36495a" points="403,582 610,582 610,655 403,655" stroke="#62a1ff" stroke-width="3" /><circle cx="423" cy="601" fill="#afc4d0" r="5" /><circle cx="423" cy="636" fill="#afc4d0" r="5" /><circle cx="587" cy="601" fill="#afc4d0" r="5" /><circle cx="587" cy="636" fill="#afc4d0" r="5" /><rect fill="#1c2935" height="43" rx="2" stroke="#577189" stroke-width="2" width="183" x="415" y="596" /><ellipse cx="506" cy="617" fill="#23394a" rx="61" ry="18" stroke="#49cfdb" stroke-width="2" /><text fill="#edf4fb" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" x="622" y="618">E  120×38mm 风扇（外置）</text><text fill="#97acbd" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" x="624" y="647">25 / 38 / 50 / 55mm 厚度兼容目标</text><rect fill="#87d5ac" height="8" rx="2" width="202" x="406" y="568" /><text fill="#87d5ac" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" x="618" y="575">单片密封垫</text><polygon fill="#365266" points="354,327 544,331 623,442 623,554 390,554 350,507 280,463 221,432 219,374" stroke="#9db8cd" stroke-width="3" /><polygon fill="#101d29" points="226,378 348,385 353,480 225,450" stroke="#62a1ff" stroke-width="2" /><polygon fill="#8fa4b6" points="386,552 608,552 608,562 386,562" stroke="#cfdae4" stroke-width="1" /><text fill="#edf4fb" font-family="Noto Sans CJK SC, sans-serif" font-size="37" font-weight="700" x="425" y="368">A</text><text fill="#edf4fb" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" x="424" y="397">连续密封</text><text fill="#edf4fb" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" x="424" y="426">90°短风道</text><line stroke="#49cfdb" stroke-linecap="round" stroke-width="6" x1="501" x2="501" y1="518" y2="445" /><polygon fill="#49cfdb" points="501,445 510.10908523347985,461.67406867591706 491.89091476652015,461.67406867591706" /><line stroke="#49cfdb" stroke-linecap="round" stroke-width="6" x1="501" x2="338" y1="445" y2="418" /><polygon fill="#49cfdb" points="338,418 355.93850265301006,411.7382013312507 352.96133623970434,429.71146523380014" /><text fill="#49cfdb" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" x="234" y="498">进风 → 90° 转弯 → 前方出风</text><polygon fill="#8495a7" points="88,338 185,352 215,387 213,458 92,442 64,421" stroke="#d9e8f1" stroke-width="3" /><polygon fill="#12202b" points="80,362 191,372 201,394 81,385" stroke="#49cfdb" stroke-width="1.5" /><polygon fill="#12202b" points="78,406 197,417 202,431 82,425" stroke="#49cfdb" stroke-width="1.5" /><polygon fill="#d5e0ec" points="66,396 212,390 217,409 72,412" stroke="#6b8ea8" stroke-width="2" /><text fill="#edf4fb" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" x="95" y="300">B  STRIKE 可换前罩</text><polyline fill="none" points="213,402 234,402" stroke="#f1b966" stroke-dasharray="5 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><text fill="#97acbd" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" x="88" y="472">斜切凸脊 / 上下内凹</text><rect fill="#62a1ff" height="12" rx="3" width="122" x="98" y="529" /><rect fill="#62a1ff" height="12" rx="3" width="122" x="98" y="549" /><circle cx="97" cy="545" fill="#f1b966" r="6" /><circle cx="221" cy="545" fill="#f1b966" r="6" /><text fill="#edf4fb" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" x="80" y="593">C  联动双百叶内芯</text><text fill="#f1b966" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" x="80" y="619">上下偏转目标 ±12°</text><line stroke="#f1b966" stroke-dasharray="5 7" stroke-width="2" x1="218" x2="222" y1="395" y2="360" /><text fill="#edf4fb" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" x="73" y="685">B 与 A 之间：定位止口 + 隐藏 M3 + 窄密封条</text><text fill="#97acbd" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" x="73" y="721">C 在前罩内部运动；主体、风扇和承力支架保持不动</text><text fill="#49cfdb" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" x="73" y="754">重点：可换外观不需要重打整个密封风道</text><rect fill="#202e3e" height="228" rx="12" ry="12" stroke="#405367" stroke-width="1.5" width="590" x="1136" y="230" /><rect fill="#202e3e" height="275" rx="12" ry="12" stroke="#405367" stroke-width="1.5" width="590" x="1136" y="479" /><text fill="#edf4fb" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" x="1161" y="263">D1  立柱内侧固定</text><rect fill="#1b2430" height="135" stroke="#8596aa" stroke-width="3" width="59" x="1173" y="288" /><line stroke="#5f7184" stroke-width="3" x1="1192" x2="1192" y1="290" y2="421" /><line stroke="#5f7184" stroke-width="3" x1="1214" x2="1214" y1="290" y2="421" /><polygon fill="#8596aa" points="1238,329 1320,329 1333,347 1320,366 1238,366" /><polygon fill="#48627a" points="1320,299 1430,299 1474,333 1484,365 1351,365 1320,348" stroke="#49cfdb" stroke-width="2" /><circle cx="1255" cy="347" fill="#f1b966" r="6" /><circle cx="1290" cy="347" fill="#f1b966" r="6" /><text fill="#edf4fb" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" x="1502" y="322">风道外壁</text><text fill="#edf4fb" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" x="1502" y="348">承力接口</text><text fill="#87d5ac" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" x="1163" y="442">直接选高度，用 4040 槽内 M5 固定；无滑轨</text><text fill="#edf4fb" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" x="1161" y="513">D2  底部横梁固定</text><rect fill="#1b2430" height="47" stroke="#8596aa" stroke-width="3" width="304" x="1162" y="683" /><line stroke="#5f7184" stroke-width="3" x1="1165" x2="1461" y1="696" y2="696" /><line stroke="#5f7184" stroke-width="3" x1="1165" x2="1461" y1="715" y2="715" /><polygon fill="#8596aa" points="1254,592 1360,592 1384,651 1316,651 1316,684 1293,684 1293,639" stroke="#f1b966" stroke-width="2" /><polygon fill="#48627a" points="1212,556 1366,556 1412,579 1444,597 1274,597 1212,577" stroke="#49cfdb" stroke-width="2" /><rect fill="#17212d" height="30" stroke="#49cfdb" stroke-dasharray="6 6" stroke-width="1.7" width="111" x="1235" y="600" /><line stroke="#87d5ac" stroke-linecap="round" stroke-width="4" x1="1287" x2="1287" y1="672" y2="643" /><polygon fill="#87d5ac" points="1287,643 1296.1090852334798,659.674068675917 1277.8909147665202,659.674068675917" /><text fill="#edf4fb" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" x="1480" y="597">风扇进气面</text><text fill="#f1b966" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" x="1480" y="627">不能贴住横梁</text><text fill="#87d5ac" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" x="1162" y="746">横梁适配件需给 38mm 厚风扇留进气净空</text><text fill="#edf4fb" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" x="75" y="854">03  预计零件组成（每侧）</text><circle cx="103" cy="918" fill="#49cfdb" r="24" /><text fill="#0e141c" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle" x="103" y="926">A</text><text fill="#edf4fb" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" x="144" y="914">短风道主体</text><text fill="#97acbd" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" x="144" y="942">1 件</text><circle cx="443" cy="918" fill="#62a1ff" r="24" /><text fill="#0e141c" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle" x="443" y="926">B</text><text fill="#edf4fb" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" x="484" y="914">可换前罩</text><text fill="#97acbd" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" x="484" y="942">1 件</text><circle cx="783" cy="918" fill="#f1b966" r="24" /><text fill="#0e141c" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle" x="783" y="926">C</text><text fill="#edf4fb" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" x="824" y="914">双百叶可调芯</text><text fill="#97acbd" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" x="824" y="942">1 件</text><circle cx="1123" cy="918" fill="#87d5ac" r="24" /><text fill="#0e141c" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle" x="1123" y="926">D</text><text fill="#edf4fb" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" x="1164" y="914">金属支架</text><text fill="#97acbd" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" x="1164" y="942">立柱或横梁 1 件</text><circle cx="1463" cy="918" fill="#edf4fb" r="24" /><text fill="#0e141c" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle" x="1463" y="926">E</text><text fill="#edf4fb" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" x="1504" y="914">外置风扇</text><text fill="#97acbd" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" x="1504" y="942">120mm + 1片垫</text><text fill="#f1b966" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" x="77" y="982">⚠ 当前为接口/架构研究图，不是已验证的 R4.13 CAD。螺孔、壁厚、密封和支架载荷仍须建模与打样确认。</text></svg>